name: agos
description: AGOS Flood Early Warning — Resident App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State management
  provider: ^6.1.2

  # Environment variables
  flutter_dotenv: ^5.1.0

  # HTTP
  http: ^1.2.1

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # WebView (for radar/windy)
  webview_flutter: ^4.7.0

  # UI
  google_fonts: ^6.2.1

  google_maps_flutter: ^2.6.0

  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
